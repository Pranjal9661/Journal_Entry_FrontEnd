  <text x="88" y="46" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Journal <tspan fill="#4f46e5">Entry</tspan></text>
  <!-- Tagline -->
